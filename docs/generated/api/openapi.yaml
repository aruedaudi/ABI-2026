  /api/contents:
    get:
      summary: 'Obtiene un listado paginado de contenidos disponibles'
      operationId: obtieneUnListadoPaginadoDeContenidosDisponibles
      description: "Soporta filtrado por:\n- Búsqueda general (nombre y descripción)\n- Roles específicos (mediante campo JSON)\n- Paginación configurable"
      parameters: []
      responses: {  }
      tags:
        - 'API Endpoints'
      security: []
    post:
      summary: 'Crea un nuevo contenido en el catálogo'
      operationId: creaUnNuevoContenidoEnElCatlogo
      description: "Valida y registra un nuevo contenido dentro de una transacción\npara garantizar integridad de datos."
      parameters: []
      responses: {  }
      tags:
        - 'API Endpoints'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'El campo value no debe tener más de 100 caracteres.'
                  example: ufkaaacsmazquuxslxug
                description:
                  type: string
                  description: ''
                  example: 'Incidunt velit aperiam sit aperiam sunt impedit deleniti.'
                  nullable: true
                roles:
                  type: array
                  description: ''
                  example:
                    - committee_leader
                  items:
                    type: string
                    enum:
                      - research_staff
                      - professor
                      - student
                      - committee_leader
              required:
                - name
                - roles
      security: []
